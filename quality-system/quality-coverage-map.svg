<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-labelledby="title desc">
  <title id="title">软件交付质量覆盖图（示例）</title>
  <desc id="desc">七个软件交付阶段与七类质量领域组成的覆盖矩阵。颜色表示措施落地状态，数字表示措施数量。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
    .title { font-size: 32px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #596579; }
    .stage { font-size: 17px; font-weight: 700; }
    .stage-en { font-size: 12px; fill: #718096; }
    .metric { font-size: 13px; font-weight: 700; fill: #275e38; }
    .row { font-size: 16px; font-weight: 600; }
    .count { font-size: 14px; font-weight: 700; fill: #172033; }
    .legend { font-size: 14px; fill: #46536a; }
    .note { font-size: 14px; fill: #596579; }
    .small { font-size: 12px; fill: #718096; }
  </style>

  <rect width="1600" height="970" fill="#f7f9fc"/>
  <text x="70" y="67" class="title">软件交付质量覆盖图</text>
  <text x="70" y="98" class="subtitle">示例视图：覆盖矩阵显示各阶段的质量控制状态；数字表示已登记措施数量</text>

  <!-- Legend -->
  <rect x="1045" y="47" width="20" height="20" rx="4" fill="#22a06b"/>
  <text x="1075" y="63" class="legend">已落地</text>
  <rect x="1160" y="47" width="20" height="20" rx="4" fill="#e6a817"/>
  <text x="1190" y="63" class="legend">待加强</text>
  <rect x="1275" y="47" width="20" height="20" rx="4" fill="#a8b1c1"/>
  <text x="1305" y="63" class="legend">待建设</text>
  <rect x="1390" y="47" width="20" height="20" rx="4" fill="#d14343"/>
  <text x="1420" y="63" class="legend">关键缺口</text>

  <!-- Header -->
  <rect x="70" y="145" width="1460" height="132" rx="8" fill="#eaf0f7"/>
  <text x="94" y="198" class="stage">质量领域</text>
  <text x="94" y="221" class="stage-en">Quality area</text>

  <!-- Seven stage headers -->
  <g text-anchor="middle">
    <text x="430" y="181" class="stage">规划与变更</text><text x="430" y="204" class="stage-en">Plan &amp; Change</text><rect x="394" y="222" width="72" height="30" rx="15" fill="#dff3e8"/><text x="430" y="242" class="metric">3 / 5 已覆盖</text>
    <text x="590" y="181" class="stage">设计与实现</text><text x="590" y="204" class="stage-en">Design &amp; Implement</text><rect x="554" y="222" width="72" height="30" rx="15" fill="#dff3e8"/><text x="590" y="242" class="metric">5 / 6 已覆盖</text>
    <text x="750" y="181" class="stage">集成与构建</text><text x="750" y="204" class="stage-en">Integrate &amp; Build</text><rect x="714" y="222" width="72" height="30" rx="15" fill="#fff0ca"/><text x="750" y="242" class="metric">3 / 5 已覆盖</text>
    <text x="910" y="181" class="stage">验证与准入</text><text x="910" y="204" class="stage-en">Verify &amp; Gate</text><rect x="874" y="222" width="72" height="30" rx="15" fill="#dff3e8"/><text x="910" y="242" class="metric">5 / 6 已覆盖</text>
    <text x="1070" y="181" class="stage">发布与部署</text><text x="1070" y="204" class="stage-en">Release &amp; Deploy</text><rect x="1034" y="222" width="72" height="30" rx="15" fill="#fff0ca"/><text x="1070" y="242" class="metric">2 / 5 已覆盖</text>
    <text x="1230" y="181" class="stage">运行与观测</text><text x="1230" y="204" class="stage-en">Operate &amp; Observe</text><rect x="1194" y="222" width="72" height="30" rx="15" fill="#fff0ca"/><text x="1230" y="242" class="metric">3 / 6 已覆盖</text>
    <text x="1390" y="181" class="stage">反馈与改进</text><text x="1390" y="204" class="stage-en">Feedback &amp; Improve</text><rect x="1354" y="222" width="72" height="30" rx="15" fill="#fff0ca"/><text x="1390" y="242" class="metric">2 / 5 已覆盖</text>
  </g>

  <!-- Matrix background and rows -->
  <g>
    <rect x="70" y="293" width="1460" height="80" fill="#ffffff"/><rect x="70" y="373" width="1460" height="80" fill="#f1f5f9"/>
    <rect x="70" y="453" width="1460" height="80" fill="#ffffff"/><rect x="70" y="533" width="1460" height="80" fill="#f1f5f9"/>
    <rect x="70" y="613" width="1460" height="80" fill="#ffffff"/><rect x="70" y="693" width="1460" height="80" fill="#f1f5f9"/>
    <rect x="70" y="773" width="1460" height="80" fill="#ffffff"/>
    <g stroke="#d9e1eb" stroke-width="1">
      <line x1="350" y1="293" x2="350" y2="853"/><line x1="510" y1="293" x2="510" y2="853"/><line x1="670" y1="293" x2="670" y2="853"/>
      <line x1="830" y1="293" x2="830" y2="853"/><line x1="990" y1="293" x2="990" y2="853"/><line x1="1150" y1="293" x2="1150" y2="853"/><line x1="1310" y1="293" x2="1310" y2="853"/>
    </g>
  </g>

  <!-- Row labels -->
  <g>
    <text x="94" y="340" class="row">需求与变更</text><text x="94" y="420" class="row">架构与代码</text><text x="94" y="500" class="row">测试与验证</text>
    <text x="94" y="580" class="row">安全与合规</text><text x="94" y="660" class="row">发布与配置</text><text x="94" y="740" class="row">稳定性与可观测性</text><text x="94" y="820" class="row">度量与持续改进</text>
  </g>

  <!-- Cells: center points x 430,590,750,910,1070,1230,1390; y 333,413,493,573,653,733,813 -->
  <g>
    <!-- 需求与变更 -->
    <circle cx="430" cy="333" r="16" fill="#22a06b"/><text x="430" y="338" text-anchor="middle" class="count">3</text>
    <circle cx="590" cy="333" r="16" fill="#22a06b"/><text x="590" y="338" text-anchor="middle" class="count">1</text>
    <circle cx="750" cy="333" r="16" fill="#a8b1c1"/><text x="750" y="338" text-anchor="middle" class="count">0</text>
    <circle cx="910" cy="333" r="16" fill="#22a06b"/><text x="910" y="338" text-anchor="middle" class="count">2</text>
    <circle cx="1070" cy="333" r="16" fill="#a8b1c1"/><text x="1070" y="338" text-anchor="middle" class="count">0</text>
    <circle cx="1230" cy="333" r="16" fill="#a8b1c1"/><text x="1230" y="338" text-anchor="middle" class="count">0</text>
    <circle cx="1390" cy="333" r="16" fill="#22a06b"/><text x="1390" y="338" text-anchor="middle" class="count">1</text>
    <!-- 架构与代码 -->
    <circle cx="430" cy="413" r="16" fill="#a8b1c1"/><text x="430" y="418" text-anchor="middle" class="count">0</text>
    <circle cx="590" cy="413" r="16" fill="#22a06b"/><text x="590" y="418" text-anchor="middle" class="count">4</text>
    <circle cx="750" cy="413" r="16" fill="#22a06b"/><text x="750" y="418" text-anchor="middle" class="count">2</text>
    <circle cx="910" cy="413" r="16" fill="#e6a817"/><text x="910" y="418" text-anchor="middle" class="count">1</text>
    <circle cx="1070" cy="413" r="16" fill="#a8b1c1"/><text x="1070" y="418" text-anchor="middle" class="count">0</text>
    <circle cx="1230" cy="413" r="16" fill="#a8b1c1"/><text x="1230" y="418" text-anchor="middle" class="count">0</text>
    <circle cx="1390" cy="413" r="16" fill="#a8b1c1"/><text x="1390" y="418" text-anchor="middle" class="count">0</text>
    <!-- 测试与验证 -->
    <circle cx="430" cy="493" r="16" fill="#a8b1c1"/><text x="430" y="498" text-anchor="middle" class="count">0</text>
    <circle cx="590" cy="493" r="16" fill="#22a06b"/><text x="590" y="498" text-anchor="middle" class="count">2</text>
    <circle cx="750" cy="493" r="16" fill="#22a06b"/><text x="750" y="498" text-anchor="middle" class="count">2</text>
    <circle cx="910" cy="493" r="16" fill="#22a06b"/><text x="910" y="498" text-anchor="middle" class="count">5</text>
    <circle cx="1070" cy="493" r="16" fill="#e6a817"/><text x="1070" y="498" text-anchor="middle" class="count">1</text>
    <circle cx="1230" cy="493" r="16" fill="#a8b1c1"/><text x="1230" y="498" text-anchor="middle" class="count">0</text>
    <circle cx="1390" cy="493" r="16" fill="#22a06b"/><text x="1390" y="498" text-anchor="middle" class="count">1</text>
    <!-- 安全与合规 -->
    <circle cx="430" cy="573" r="16" fill="#e6a817"/><text x="430" y="578" text-anchor="middle" class="count">1</text>
    <circle cx="590" cy="573" r="16" fill="#22a06b"/><text x="590" y="578" text-anchor="middle" class="count">2</text>
    <circle cx="750" cy="573" r="16" fill="#22a06b"/><text x="750" y="578" text-anchor="middle" class="count">2</text>
    <circle cx="910" cy="573" r="16" fill="#22a06b"/><text x="910" y="578" text-anchor="middle" class="count">2</text>
    <circle cx="1070" cy="573" r="16" fill="#22a06b"/><text x="1070" y="578" text-anchor="middle" class="count">1</text>
    <circle cx="1230" cy="573" r="16" fill="#e6a817"/><text x="1230" y="578" text-anchor="middle" class="count">1</text>
    <circle cx="1390" cy="573" r="16" fill="#e6a817"/><text x="1390" y="578" text-anchor="middle" class="count">1</text>
    <!-- 发布与配置 -->
    <circle cx="430" cy="653" r="16" fill="#a8b1c1"/><text x="430" y="658" text-anchor="middle" class="count">0</text>
    <circle cx="590" cy="653" r="16" fill="#a8b1c1"/><text x="590" y="658" text-anchor="middle" class="count">0</text>
    <circle cx="750" cy="653" r="16" fill="#22a06b"/><text x="750" y="658" text-anchor="middle" class="count">2</text>
    <circle cx="910" cy="653" r="16" fill="#e6a817"/><text x="910" y="658" text-anchor="middle" class="count">1</text>
    <circle cx="1070" cy="653" r="16" fill="#22a06b"/><text x="1070" y="658" text-anchor="middle" class="count">3</text>
    <circle cx="1230" cy="653" r="16" fill="#e6a817"/><text x="1230" y="658" text-anchor="middle" class="count">1</text>
    <circle cx="1390" cy="653" r="16" fill="#a8b1c1"/><text x="1390" y="658" text-anchor="middle" class="count">0</text>
    <!-- 稳定性与可观测性 -->
    <circle cx="430" cy="733" r="16" fill="#a8b1c1"/><text x="430" y="738" text-anchor="middle" class="count">0</text>
    <circle cx="590" cy="733" r="16" fill="#a8b1c1"/><text x="590" y="738" text-anchor="middle" class="count">0</text>
    <circle cx="750" cy="733" r="16" fill="#e6a817"/><text x="750" y="738" text-anchor="middle" class="count">1</text>
    <circle cx="910" cy="733" r="16" fill="#e6a817"/><text x="910" y="738" text-anchor="middle" class="count">1</text>
    <circle cx="1070" cy="733" r="16" fill="#e6a817"/><text x="1070" y="738" text-anchor="middle" class="count">1</text>
    <circle cx="1230" cy="733" r="16" fill="#22a06b"/><text x="1230" y="738" text-anchor="middle" class="count">4</text>
    <circle cx="1390" cy="733" r="16" fill="#22a06b"/><text x="1390" y="738" text-anchor="middle" class="count">1</text>
    <!-- 度量与持续改进 -->
    <circle cx="430" cy="813" r="16" fill="#a8b1c1"/><text x="430" y="818" text-anchor="middle" class="count">0</text>
    <circle cx="590" cy="813" r="16" fill="#a8b1c1"/><text x="590" y="818" text-anchor="middle" class="count">0</text>
    <circle cx="750" cy="813" r="16" fill="#a8b1c1"/><text x="750" y="818" text-anchor="middle" class="count">0</text>
    <circle cx="910" cy="813" r="16" fill="#a8b1c1"/><text x="910" y="818" text-anchor="middle" class="count">0</text>
    <circle cx="1070" cy="813" r="16" fill="#a8b1c1"/><text x="1070" y="818" text-anchor="middle" class="count">0</text>
    <circle cx="1230" cy="813" r="16" fill="#22a06b"/><text x="1230" y="818" text-anchor="middle" class="count">2</text>
    <circle cx="1390" cy="813" r="16" fill="#22a06b"/><text x="1390" y="818" text-anchor="middle" class="count">3</text>
  </g>

  <rect x="70" y="885" width="1460" height="48" rx="8" fill="#eaf0f7"/>
  <text x="94" y="915" class="note">使用原则：颜色按最弱的关键控制状态确定；数字为该单元格已登记措施数。总览用于识别覆盖缺口，具体措施、负责人和证据应在配套台账中维护。</text>
  <text x="70" y="958" class="small">状态与数据均为示例，不代表当前项目评估结果。</text>
</svg>
